<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ff.ai — ассистент по разработке</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-head">
    <span class="brand">ff.ai</span>
    <button id="sidebar-close" class="icon" type="button" title="Скрыть панель">×</button>
  </div>

  <button id="new-session" class="wide ghost" type="button">Новая сессия</button>

  <section class="block">
    <h3>Задача</h3>
    <div class="row">
      <button data-task="run" type="button">Запустить</button>
      <button data-task="pause" type="button">Пауза</button>
      <button data-task="resume" type="button">Продолжить</button>
    </div>
    <div id="task" class="task empty">Задач нет.</div>
  </section>

  <section class="block">
    <h3>Настройки</h3>
    <form id="settings-form" class="settings">
      <label>Формат ответа
        <select id="set-format">
          <option value="free">Свободный</option>
          <option value="compact">Компактный</option>
          <option value="json">JSON</option>
          <option value="patch">Патч</option>
        </select>
      </label>
      <label>Стратегия контекста
        <select id="set-strategy">
          <option value="summary">Суммаризация</option>
          <option value="sliding_window">Скользящее окно</option>
          <option value="sticky_facts">Липкие факты</option>
          <option value="branching">Ветвление</option>
        </select>
      </label>
      <label>Модель<select id="set-model"></select></label>
      <label>Лимит слов ответа<input id="set-words" type="number" min="10" max="1000" step="10"></label>
      <label>Пунктов в списке<input id="set-list" type="number" min="1" max="20"></label>
      <label>Температура<input id="set-temperature" type="number" min="0" max="2" step="0.1"></label>
      <label>Сжатие через, сообщений<input id="set-compress" type="number" min="5" max="50"></label>
      <label>Потолок токенов сессии<input id="set-tokens" type="number" min="5000" max="50000" step="1000"></label>
      <button class="wide primary" type="submit">Применить</button>
    </form>
    <p id="settings-note" class="note"></p>
  </section>

  <section class="block">
    <h3>Отчёты</h3>
    <div class="reports" id="report-buttons">
      <button class="ghost" data-report="usage" type="button">Расход</button>
      <button class="ghost" data-report="context" type="button">Контекст</button>
      <button class="ghost" data-report="docs" type="button">Документация</button>
      <button class="ghost" data-report="code" type="button">Код</button>
      <button class="ghost" data-report="tool" type="button">Инструменты</button>
      <button class="ghost" data-report="ops" type="button">Операции</button>
      <button class="ghost" data-report="memory" type="button">Память</button>
      <button class="ghost" data-report="profile" type="button">Профиль</button>
      <button class="ghost" data-report="invariants" type="button">Правила</button>
      <button class="ghost" data-report="task" type="button">Задача</button>
    </div>
    <pre id="report" class="lines empty">Отчёт не выбран.</pre>
  </section>
</aside>

<div class="chat">
  <header class="topbar">
    <button id="sidebar-open" class="icon" type="button" title="Показать панель">☰</button>
    <div class="session">
      <span id="status" class="status">Загрузка состояния…</span>
      <span id="status-note" class="muted"></span>
    </div>
  </header>

  <main id="feed" class="feed"></main>

  <div id="jump" class="jump hidden">
    <button class="ghost" id="jump-button" type="button">↓ К последнему сообщению</button>
  </div>

  <form id="composer" class="composer">
    <textarea id="question" rows="1" autocomplete="off"
      placeholder="Вопрос или команда (/usage, /task add …, /docs status). Enter — отправить, Shift+Enter — новая строка"></textarea>
    <button class="primary" id="send" type="submit">Отправить</button>
  </form>
</div>

<script src="static/app.js"></script>
</body>
</html>

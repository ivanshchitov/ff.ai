; Пресеты моделей для router-режима llama-server.
; Запуск: llama_server/server.sh (или llama-server --models-preset llama_server/models.ini).
; Список моделей: GET /v1/models
;
; Идентификаторы секций совпадают с идентификаторами моделей в кэше Hugging Face, поэтому пути к
; файлам не нужны: имя пресета и есть имя модели в кэше. Проверить идентификаторы: llama-server -cl.
; После добавления новой модели в кэш сервер нужно перезапустить.
;
; Общей секции `[*]` здесь нет намеренно: этот же файл читает приложение, чтобы показать пресеты
; в списке моделей (`config.local_models`), а стандартный разбор INI не принимает ни ключей вне
; секций, ни служебной секции `*`. Поэтому общие для всех пресетов ключи повторяются в каждой
; секции — их немного. По той же причине нет и заголовка `version`: llama-server принимает файл
; без него (формат пресетов по умолчанию первой версии).
;
; Комментарии — только отдельными строками: значение с хвостовым пояснением разбирается как
; «значение ; пояснение» тем читателем, который не умеет отбрасывать хвосты.
;
; Модели не загружаются при старте (`load-on-startup` не выставлен): llama-server поднимает
; пресет по первому запросу к нему, поэтому память не тратится, пока локальную модель не выбрали.
;
; Пресет с `embedding = true` — модель векторов для индекса кода; в списке моделей чата он не
; появляется, а для локального поиска нужен ровно один такой пресет.

[unsloth/Qwen3.5-2B-GGUF:Q4_K_M]
; Быстрый пресет: ответ по коду, когда важна задержка, а не глубина.
; n-gpu-layers — всё, что помещается, уходит на графический ускоритель.
; c — контекст держит модель в рамках общей памяти, а не только видеопамяти.
; reasoning-budget — бюджет рассуждения для маленькой модели: иначе ответ ждётся минутами.
n-gpu-layers = 999
c = 32000
temp = 0.7
top-p = 0.95
top-k = 20
min-p = 0.05
reasoning = auto
reasoning-budget = 256

[unsloth/Qwen3.5-4B-GGUF:Q4_K_M]
; Основной пресет для кода: качество по Qt/QML важнее задержки.
n-gpu-layers = 999

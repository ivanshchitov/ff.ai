[tool.pytest.ini_options]
# Пакеты core/ и ui/ импортируются от корня репозитория: точка входа
# ff-ai.py содержит дефис и модулем не является, поэтому добавить корень
# в sys.path через неё невозможно.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "pty: тесты, которым нужен настоящий псевдотерминал (Unix)",
    "e2e: полный прогон приложения через псевдотерминал против stub-сервера",
    "network: обращение к внешним сервисам — MCP-сервер документации портала, облачный API",
    "slow: сквозные файлы с минутными прогонами (задача, планировщик, web, локальная модель)",
]
# По умолчанию — быстрый набор: юнит-слой и короткие сквозные. Полный набор: `pytest -m ""`,
# только долгие: `pytest -m slow`.
addopts = "-m 'not network and not slow'"
filterwarnings = ["error::DeprecationWarning:core.*", "error::DeprecationWarning:ui.*"]

[tool.coverage.run]
source = ["core", "ui"]

name: ff.ai PR review

on:
  workflow_call:
    inputs:
      ffai_ref:
        description: Trusted ff.ai implementation commit
        required: false
        type: string
        default: 4720a3fe3ceacf67397961681a655c4d3d6ee5d0
      domain:
        required: false
        type: string
        default: aurora-qt5
      model:
        required: false
        type: string
        default: deepseek-v4.1-flash
    secrets:
      OPENCODE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted ff.ai
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ivanshchitov/ff.ai
          ref: ${{ inputs.ffai_ref }}
          path: ffai
          persist-credentials: false
      - name: Checkout PR data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: project
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install trusted dependencies
        run: python -m pip install -r ffai/requirements.txt
      - name: Review PR with code and documentation RAG
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_DOMAIN: ${{ inputs.domain }}
          REVIEW_MODEL: ${{ inputs.model }}
          FFAI_LLAMA_AUTOSTART: '0'
          FFAI_STATE_DIR: ${{ runner.temp }}/ffai-state
          FFAI_CACHE_DIR: ${{ runner.temp }}/ffai-cache
          FFAI_NO_REEXEC: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ]; then
            mkdir -p "$RUNNER_TEMP/ffai-review"
            python - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'ffai-review'
          report = {'status': 'not_run', 'reason': 'OPENCODE_API_KEY недоступен; AI-ревью не выполнялось.'}
          (output / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(report['reason'])
          PY
            printf '%s\n' 'AI-ревью не выполнялось: OPENCODE_API_KEY недоступен.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python ffai/ff-ai-review.py --repo "$GITHUB_WORKSPACE/project" \
            --domain "$REVIEW_DOMAIN" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --model "$REVIEW_MODEL" --output "$RUNNER_TEMP/ffai-review"
          cat "$RUNNER_TEMP/ffai-review/review.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save review and pipeline report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffai-pr-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffai-review/
          if-no-files-found: warn
          retention-days: 7
